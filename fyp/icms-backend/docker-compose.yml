services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icms
      POSTGRES_PASSWORD: icms
      POSTGRES_DB: icms
    # Host 5433 avoids clashing with a local PostgreSQL service already on 5432
    ports:
      - "5433:5432"
    volumes:
      - icms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icms -d icms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  icms_pgdata:
